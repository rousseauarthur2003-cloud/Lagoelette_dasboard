e-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 14px; padding: 12px; border-radius: 8px; background: #0d1a24; border: 1px solid var(--line); }\n.calc-box span { display: block; font-size: 12px; color: var(--muted); }\n.calc-box strong { font-size: 16px; font-weight: 500; color: #f1ede6; }\n.calc-box .calc-main strong { color: var(--gold-text); font-size: 19px; }\n\n.modal-overlay { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 16px; background: rgba(2,8,12,0.72); backdrop-filter: blur(3px); animation: fade-in 0.15s ease; }\n.modal { width: 100%; max-height: calc(100vh - 32px); overflow: auto; background: #0b1821; border: 1px solid #2a3845; border-radius: 12px; box-shadow: 0 30px 80px rgba(0,0,0,0.55); animation: modal-in 0.18s ease; }\n.modal-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding: 18px 20px 14px; border-bottom: 1px solid var(--line-soft); }\n.modal-head h3 { font-family: var(--font-serif); font-size: 26px; font-weight: 600; color: var(--cream); line-height: 1.1; }\n.modal-head p { margin-top: 4px; font-size: 13px; color: var(--muted); }\n.modal-body { padding: 18px 20px; }\n.modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--line-soft); }\n.confirm-body { display: flex; gap: 14px; align-items: flex-start; color: var(--text-dim); }\n.confirm-body svg { color: #f0a868; flex: none; margin-top: 2px; }\n@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }\n@keyframes modal-in { from { opacity: 0; transform: translateY(8px) scale(0.99); } to { opacity: 1; transform: none; } }\n\n.toast-stack { position: fixed; right: 18px; bottom: 18px; z-index: 200; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }\n.toast { display: flex; align-items: center; gap: 10px; max-width: 380px; padding: 11px 14px; border-radius: 8px; background: #0f1d27; border: 1px solid #2a3845; box-shad function parseISODate(iso) {
    const [y, m, d] = iso.split('-').map(Number);
    return new Date(y, m - 1, d);
}
function toISODate(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
}
function addDaysISO(iso, n) {
    const d = parseISODate(iso);

}

    return text ? text.charAt(0).toUpperCase() + text.slice(1) : '';
}
function formatLongDate(iso) {
    const d = parseISODate(iso);

    return capitalize(`${days[d.getDay()]} ${d.getDate()} ${MONTH_NAMES[d.getMonth()]} ${d.getFullYear()}`);
}
function formatDayMonth(iso) {
    const [, m, d] = iso.split('-');
    return `${d}/${m}`;
}

}

    return `${formatNumber(value, decimals)} %`;

function percentChange(current, previous) {

// Ferme un menu quand on clique à l'extérieur ou qu'on appuie sur Échap
function useDismiss(ref, open, onClose) {
    useEffect(() => {
        if (!open)
            return undefined;
        const handlePointer = (event) => {
            if (ref.current && !ref.current.contains(event.target))
                onClose();
        };
        const handleKey = (event) => {
            if (event.key === 'Escape')
                onClose();
        };
        document.addEventListener('mousedown', handlePointer);
        document.addEventListener('touchstart', handlePointer);
        document.addEventListener('keydown', handleKey);
        return () => {
            document.removeEventListener('mousedown', handlePointer);
            document.removeEventListener('touchstart', handlePointer);
            document.removeEventListener('keydown', handleKey);
        };
    }, [ref, open, onClose]);
}
// Tri de tableau : clic sur un en-tête → tri croissant / décroissant
function useSortedRows(rows, initialKey, initialDir = 'desc') {
    const [sort, setSort] = useState({ key: initialKey, dir: initialDir });
    const sorted = useMemo(() => {
        const list = [...rows];
        list.sort((a, b) => {
            const va = a[sort.key];
            const vb = b[sort.key];
            const result = typeof va === 'string' ? va.localeCompare(vb, 'fr') : (va ?? 0) - (vb ?? 0);
            return sort.dir === 'asc' ? result : -result;
        });
        return list;
    }, [rows, sort]);
    const toggleSort = (key) => setSort((s) => (s.key === key ? { key, dir: s.dir === 'asc' ? 'desc' : 'asc' } : { key, dir: typeof rows[0]?.[key] === 'string' ? 'asc' : 'desc' }));
    return { sorted, sort, toggleSort };
}

    if (period === '30days')
        return periodRange('30days', addDaysISO(refIso, -30));
    if (period === 'month') {
        const d = parseISODate(refIso);
        const prevMonth = new Date(d.getFullYear(), d.getMonth() - 1, 1);
        const day = Math.min(d.getDate(), daysInMonth(prevMonth.getFullYear(), prevMonth.getMonth()));

function dayRevenue(day, filters = {}) {

        return 0;
    const services = filters.service === 'lunch' || filters.service === 'dinner' ? [filters.service] : ['lunch', 'dinner'];
    const cats = filters.category && filters.category !== 'all' ? [filters.category] : CATEGORY_KEYS;
    let total = 0;
    services.forEach((s) => cats.forEach((c) => { total += day[s][c]; }));

    const result = {

        byCategory: { food: 0, drinks: 0, desserts: 0 },
        byPayment: { cb: 0, tickets: 0, especes: 0, cheque: 0 },
    };
    eachDay(range.from, range.to).forEach((iso) => {
        const day = dayIndex.get(iso);
        if (!day)
            return;
        const full = dayRevenue(day);
        result.days += 1;
        result.revenue += dayRevenue(day, filters);
        result.grossRevenue += full;
        result.serviceRevenue += dayRevenue(day, { service: filters.service });
        result.cost += full * day.costRatio;
        result.covers += dayCovers(day, filters.service);
        result.lunchCovers += day.lunch.covers;
        result.dinnerCovers += day.dinner.covers;
        CATEGORY_KEYS.forEach((c) => { result.byCategory[c] += dayRevenue(day, { ...filters, category: c }); });
        PAYMENT_KEYS.forEach((p) => { result.byPayment[p] += dayRevenue(day, { ...filters, payment: p }); });
    });
    result.avgTicket = result.covers ? result.serviceRevenue / result.covers : 0;
    result.margin = result.grossRevenue ? (1 - result.cost / result.grossRevenue) * 100 : 0;
    result.avgCoversPerDay = result.days ? result.covers / result.days : 0;
